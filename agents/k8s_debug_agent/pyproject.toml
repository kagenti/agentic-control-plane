[project]
name = "k8s-debug-agent"
version = "0.1.0"
description = "Kubernetes debugging agent implementing the A2A protocol."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ag2[openai,mcp]>=0.10.0",
    "a2a-sdk>=0.3.10",
    # OTEL GenAI Auto-Instrumentation (uses gen_ai.* semantic conventions)
    # Note: GenAI to OpenInference conversion is handled by OTEL Collector
    "opentelemetry-instrumentation-openai-v2>=2.0b0",
    # OpenTelemetry Core
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    # Asyncio instrumentation for context propagation across async tasks
    "opentelemetry-instrumentation-asyncio>=0.49b0",
    # HTTPX instrumentation - captures HTTP-level context that survives async/thread boundaries
    # This is critical for context propagation when frameworks (like AutoGen) cross async/sync boundaries
    "opentelemetry-instrumentation-httpx>=0.49b0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.4",
    "black>=24.4.2",
    "pre-commit>=3.7.1",
]

[project.scripts]
server = "a2a_agent:run"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]

[tool.black]
line-length = 100
target-version = ["py310"]
