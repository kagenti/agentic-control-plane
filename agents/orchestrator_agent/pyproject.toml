[project]
name = "orchestrator-agent"
version = "0.1.0"
description = "Orchestrator agent that routes tasks to specialized agents via A2A protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[all,http-server]>=0.2.5",
    "ag2[openai,mcp]==0.10.2",
    "openai>=1.0.0",
    "openinference-instrumentation-autogen>=0.1.10",
    "openinference-instrumentation-openai>=0.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
orchestrator-agent = "orchestrator_agent.a2a_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
