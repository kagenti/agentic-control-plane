name: Security Scans

on:
  pull_request:
    branches: [main]

# Explicit permissions — jobs request only what they need
permissions: {}

jobs:
  # dependency-review requires the GitHub Dependency Graph to be enabled
  # (Settings → Security → Dependency graph). Re-enable once it's turned on.
  # dependency-review: ...

  bandit:
    name: Python Security (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit (HIGH severity — blocking)
        run: |
          BANDIT_OUT=$(bandit -r agents/ tools/ \
            --severity-level high --confidence-level high \
            --exclude '**/tests/*' \
            -f json 2>/dev/null)
          HIGH=$(echo "$BANDIT_OUT" | jq '.results | length')
          if [ "$HIGH" -gt 0 ]; then
            bandit -r agents/ tools/ \
              --severity-level high --confidence-level high \
              --exclude '**/tests/*' -f txt
            exit 1
          fi
          echo "No HIGH severity issues found."

      - name: Run Bandit (MEDIUM — informational)
        run: |
          bandit -r agents/ tools/ \
            --severity-level medium --confidence-level medium \
            --exclude '**/tests/*' -f txt || true

  hadolint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          recursive: true
          failure-threshold: warning
          ignore: DL3008,DL3013,DL3015,DL3018,DL3020,DL3059

  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Run shellcheck
        run: |
          SCRIPTS=$(find . -name "*.sh" -type f | grep -v ".git/" || true)
          if [ -z "$SCRIPTS" ]; then
            echo "No shell scripts found."
            exit 0
          fi
          echo "Checking: $SCRIPTS"
          FAILED=0
          for s in $SCRIPTS; do
            shellcheck --severity=error "$s" || FAILED=1
          done
          [ $FAILED -eq 0 ] || exit 1

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Trivy scan (informational — all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0
          ignore-unfixed: true
          format: table

      - name: Trivy config scan (IaC — blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          trivyignores: .trivyignore

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          category: /language:python

  action-pinning:
    name: Verify Action Pinning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Check for unpinned GitHub Actions
        run: |
          # Strip full-line comments, then remove inline comments before checking refs
          UNPINNED=$(grep -rh "uses:" .github/workflows/ \
            | grep -vE '^\s*#' \
            | sed 's/[[:space:]]*#.*//' \
            | grep -E "@v[0-9]|@main|@master" | sort -u || true)
          if [ -n "$UNPINNED" ]; then
            echo "::warning::Found actions not pinned to SHA commits:"
            echo "$UNPINNED"
          else
            echo "All actions are SHA-pinned."
          fi
