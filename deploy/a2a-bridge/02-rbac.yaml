apiVersion: v1
kind: ServiceAccount
metadata:
  name: a2a-bridge
  namespace: kagenti-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: a2a-bridge-role
rules:
  # Allow reading AgentCard CRDs across all namespaces
  - apiGroups: ["agent.kagenti.dev"]
    resources: ["agentcards"]
    verbs: ["get", "list", "watch"]
  # Allow reading Agent CRDs for discovery
  - apiGroups: ["agent.kagenti.dev"]
    resources: ["agents"]
    verbs: ["get", "list", "watch"]
  # Allow reading Services to get agent URLs
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: a2a-bridge-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: a2a-bridge-role
subjects:
  # NOTE: Toolhive operator creates TWO ServiceAccounts:
  # - a2a-bridge-proxy-runner: Used by the MCPServerProxy deployment (proxy)
  # - a2a-bridge-sa: Used by the MCPServer statefulset (actual MCP server)
  # The MCP server (statefulset) is the one that needs RBAC to access AgentCards
  - kind: ServiceAccount
    name: a2a-bridge-proxy-runner
    namespace: kagenti-agents
  - kind: ServiceAccount
    name: a2a-bridge-sa
    namespace: kagenti-agents
